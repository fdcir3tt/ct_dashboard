services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    container_name: dashboard
    volumes:
      - ./data:/app/data:Z
      - ./log/:/app/log:Z
      - ./config.yml:/app/config.yml:Z
    env_file:
      - app/.env
    ports:
      - 8501:8501
    mem_limit: 5g
    memswap_limit: 7g