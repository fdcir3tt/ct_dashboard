stages:
  sales_etl:
    cmd: poetry run python scripts/etl.py
    deps:
      - scripts/etl.py
      - data/raw/facturas_ventas.parquet
    outs:
      - data/processed/
  train:
    cmd: poetry run python scripts/train.py
    deps:
      - scripts/train.py
      - src/mlops/models.py
      - src/mlops/utils.py
      - data/processed
      - params.yaml
    params:
      - seed
      - feature_set
      - training_window
      - model_type
      - frequency
      - horizon
    outs:
      - plots/
