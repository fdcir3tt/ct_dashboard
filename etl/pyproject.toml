[project]
name = "etl"
version = "0.1.0"
description = ""
package-mode = false
authors = [
    {name = "fdcir3tt",email = "fd.cirett@gmail.com"}
]
requires-python = ">=3.12,<3.15"
dependencies = [
    "pymongo (>=4.17.0,<5.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "pandas (>=3.0.2,<4.0.0)",
]

packages = [
  { include = "common" },
  { include = "pipelines" }
]
[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.3,<10.0.0"

[tool.poetry.group.spark.dependencies]
pyspark = ">=4.1.1,<5.0.0"