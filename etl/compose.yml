x-airflow-common: &airflow-common
  environment:
    AIRFLOW_UID: ${AIRFLOW_UID}
    AIRFLOW_GID: ${AIRFLOW_GID}
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__HOSTNAME_CALLABLE: "airflow.utils.net.get_host_ip_address"
    AIRFLOW__LOGGING__REMOTE_LOGGING: "False"
    AIRFLOW__LOGGING__DAG_PROCESSOR_MANAGER_LOG_LOCATION: /dev/null
    PYTHONPATH: /opt/airflow
  env_file:
    - config/secrets/.env
  volumes:
    - ./orchestrations:/opt/airflow/dags:z
    - ./pipelines:/opt/airflow/pipelines:z
    - ./common:/opt/airflow/common:z
    - ../data:/opt/airflow/data
    - airflow_logs:/opt/airflow/logs:z
  networks:
    - airflow

services:

  postgres:
    container_name: postgres
    image: postgis/postgis:15-3.4
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    env_file:
    - config/secrets/.env
    networks:
      - airflow
      - dashboard-net
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5

  airflow-init:
    container_name: airflow-init
    image: apache/airflow:2.9.3
    <<: *airflow-common
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      bash -c "
      airflow db migrate &&
      airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email federico.cirett@ctin.com.mx
      "

  webserver:
    image: ghcr.io/fdcir3tt/etl:latest
    pull_policy: always
    container_name: webserver
    <<: *airflow-common
    depends_on:
      - airflow-init
      - postgres
    restart: on-failure
    ports:
      - "8080:8080"
    command: webserver
    hostname: airflow-webserver

  scheduler:
    image: ghcr.io/fdcir3tt/etl:latest
    pull_policy: always
    container_name: scheduler
    <<: *airflow-common
    depends_on:
      - airflow-init
      - postgres
    restart: on-failure
    command: scheduler
    hostname: airflow-scheduler
    expose:
      - "8793" 

networks:
  airflow:
    driver: bridge
  dashboard-net:
    external: true

volumes:
  postgres_data:
    name: app_database
  airflow_logs:
    name: airflow_logs