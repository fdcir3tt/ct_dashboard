[project]
name = "ct-dashboard"
version = "0.1.0"
description = "Dashboard de almacenamiento de productos que maneja CT International"
authors = [
    {name = "fdcir3tt",email = "fd.cirett@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "streamlit (>=1.51.0,<2.0.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "matplotlib (>=3.10.7,<4.0.0)",
    "geopandas (>=1.1.1,<2.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "pyodbc (>=5.3.0,<6.0.0)",
    "pytest (>=9.0.1,<10.0.0)",
    "mysql (>=0.0.3,<0.0.4)",
    "mysql-connector-python (>=9.5.0,<10.0.0)",
    "plotly (>=6.4.0,<7.0.0)",
    "pymongo (>=4.15.4,<5.0.0)",
    "dask[distributed] (>=2025.11.0,<2026.0.0)",
    "bokeh (>=3.8.1,<4.0.0)",
    "sqlalchemy (>=2.0.44,<3.0.0)",
    "folium (>=0.20.0,<0.21.0)",
    "streamlit-folium (>=0.25.3,<0.26.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipykernel (>=7.1.0,<8.0.0)"
]
