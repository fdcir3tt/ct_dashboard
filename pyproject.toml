[project]
name = "ct-dashboard"
version = "0.1.0"
description = "Dashboard de almacenamiento de productos que maneja CT International"
authors = [
    {name = "fdcir3tt",email = "fd.cirett@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "streamlit (>=1.51.0,<2.0.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "matplotlib (>=3.10.7,<4.0.0)",
    "geopandas (>=1.1.1,<2.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "pyodbc (>=5.3.0,<6.0.0)",
    "pytest (>=9.0.1,<10.0.0)",
    "mysql (>=0.0.3,<0.0.4)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipykernel (>=7.1.0,<8.0.0)"
]
